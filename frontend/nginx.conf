# nginx for the built Atlas frontend (used by Dockerfile.prod).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the app is a single page: any path the browser asks for is handled by index.html,
    # and React Router reads the URL from there
    location / {
        try_files $uri /index.html;
    }

    # config.js is rewritten at container start; never let a browser cache a stale copy
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # built assets carry a content hash in their file name, so they can be cached for long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
