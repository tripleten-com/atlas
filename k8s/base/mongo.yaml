# MongoDB, the document store for AI outputs (docs/AI_STORE.md). The one StatefulSet in Atlas.
#
# Why a StatefulSet and not a Deployment: a StatefulSet gives each Pod a stable name (this one
# is always `mongo-0`) and a disk of its own that follows the Pod across restarts and reschedules.
# `volumeClaimTemplates` creates that PersistentVolumeClaim (`mongo-data-mongo-0`) for us, so
# there is no separate PVC object here, unlike postgres.yaml. Postgres could have been a
# StatefulSet too; it was kept a Deployment with `Recreate` so the two patterns sit side by side.
#
# The claim is not deleted with the StatefulSet. A clean reset is
#   kubectl -n atlas delete statefulset mongo && kubectl -n atlas delete pvc mongo-data-mongo-0
# (`kind delete cluster` removes everything anyway).
#
# --wiredTigerCacheSizeGB 0.25 caps the storage engine's cache; without it MongoDB takes half
# of what it believes is the machine's memory, which on a laptop cluster is the whole node.
#
# The memory limit is 1Gi, not 512Mi. Every `mongosh` started inside the Pod (the readiness
# probe, and any `kubectl exec mongo-0 -- mongosh ...`) is a Node.js process that counts against
# the same limit, and at 512Mi an interactive mongosh session was enough to get mongo-0 OOMKilled.
# The CPU limit is one core for the same reason: at half a core a mongosh start is slow enough
# to miss a probe deadline on a laptop that is short of memory.
# Ask the store with a one-shot `mongosh --quiet --eval "..."` (k8s/README.md, docs/AI_STORE.md)
# rather than an interactive shell inside the Pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: atlas
  labels:
    app: mongo
spec:
  serviceName: mongo          # the headless Service below; gives the Pod the DNS name mongo-0.mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongo
              containerPort: 27017
          # The root user is created on the first start of an empty volume from these two
          # values. Both come from the Secret; neither appears in this file.
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          # Startup and liveness are plain TCP checks on the port. They only ask "is mongod still
          # listening", start no process inside the Pod and answer in milliseconds even on a
          # laptop short of memory. The startup probe gives the first start up to 150 seconds
          # (creating the root user restarts mongod once); liveness only begins after it passes.
          startupProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness asks MongoDB itself with `ping` (no login needed, so it works before and
          # after the root user exists). mongosh is a Node.js process that can take several
          # seconds to start on a busy laptop, hence the long timeout. A slow answer here only
          # takes mongo-0 out of the Service for a moment; it never restarts the Pod.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
# Headless (clusterIP: None): no load-balancing address, just DNS. `mongo` resolves straight
# to the Pod, and `mongo-0.mongo` names it individually. The api reaches it as mongo:27017.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: atlas
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
