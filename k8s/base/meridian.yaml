# Meridian Clinical Exchange, the mock data vendor. It keeps its event log on disk, so it
# gets a PersistentVolumeClaim and (like Postgres) runs one copy with `Recreate`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meridian-data
  namespace: atlas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian
  namespace: atlas
  labels:
    app: meridian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meridian
  template:
    metadata:
      labels:
        app: meridian
    spec:
      containers:
        - name: meridian
          image: atlas-meridian:sha-dev   # the tag is replaced by kustomization.yaml
          imagePullPolicy: IfNotPresent   # the image is loaded into kind, not pulled
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: MERIDIAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: MERIDIAN_API_KEY
            - name: FEED_FACILITIES
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: FEED_FACILITIES
            - name: FEED_BACKFILL_DAYS
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: FEED_BACKFILL_DAYS
            - name: FEED_CADENCE_SCALE
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: FEED_CADENCE_SCALE
            - name: FEED_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meridian-data
---
apiVersion: v1
kind: Service
metadata:
  name: meridian
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app: meridian
  ports:
    - name: http
      port: 8100
      targetPort: http
