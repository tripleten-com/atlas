# The frontend: nginx serving the built React app. Two replicas behind one Service; the
# Ingress sends everything that is not /api, /health or /docs here.
#
# VITE_API_URL is read when the container starts and written into config.js, so the browser
# knows where the API is. On the cluster it is empty on purpose: "same origin". The page and
# the API are both served by the Ingress, so the browser calls /api on whatever address it
# loaded the page from (http://localhost, or http://localhost:8080 if you moved the port),
# and CORS never comes into it. No key or secret is needed here, and none is in the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: atlas
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: atlas-web:sha-dev   # the tag is replaced by kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VITE_API_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
